# nginx site config — edict.rectorspace.com
# Cloudflare Full (Strict) mode: CF→origin uses HTTPS with a valid cert.
# If deployment later switches to CF Origin CA cert or CF Tunnel, swap the
# ssl_certificate paths accordingly.

# ---------------------------------------------------------------------------
# Cloudflare real-IP restoration
# ---------------------------------------------------------------------------
# Without this, $remote_addr is the CF edge IP, not the visitor's IP.
# Source: https://www.cloudflare.com/ips-v4 + https://www.cloudflare.com/ips-v6
# Fetched: 2026-04-21 — CF publishes changes at those URLs; refresh periodically.
# ---------------------------------------------------------------------------
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
# IPv6
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
# Use the CF-Connecting-IP header as the authoritative client IP.
# CF always sets this header for proxied requests; it is not forgeable from
# outside because only requests from CF edge IPs (trusted above) are accepted.
real_ip_header CF-Connecting-IP;

# ---------------------------------------------------------------------------
# WebSocket upgrade map — required for Next.js HMR, SSE, and future live
# update features. Passes "upgrade" only when the client sends an Upgrade
# header, otherwise clears it so HTTP/1.1 keep-alive works cleanly.
# ---------------------------------------------------------------------------
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      "";
}

# ---------------------------------------------------------------------------
# HTTP → HTTPS redirect
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name edict.rectorspace.com;
    return 301 https://$host$request_uri;
}

# ---------------------------------------------------------------------------
# Main HTTPS server
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name edict.rectorspace.com;

    # -- Logs ----------------------------------------------------------------
    access_log /var/log/nginx/edict.access.log;
    error_log  /var/log/nginx/edict.error.log;

    # -- TLS -----------------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/edict.rectorspace.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/edict.rectorspace.com/privkey.pem;

    # TLS 1.2/1.3 only. Mozilla Intermediate cipher suite — stronger than the
    # bare "ssl_prefer_server_ciphers on" default. TLS 1.3 ignores ciphers
    # entirely; these apply only to TLS 1.2 fallback.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Session cache — small perf win: avoids full TLS handshake on reconnect.
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling — lets nginx serve the OCSP response inline, saving the
    # client a round-trip to the CA. Requires a resolvable DNS resolver.
    ssl_stapling        on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/edict.rectorspace.com/chain.pem;
    resolver 1.1.1.1 1.0.0.1 [2606:4700:4700::1111] valid=300s;
    resolver_timeout 5s;

    # -- Security headers ----------------------------------------------------
    add_header X-Frame-Options          "DENY"                               always;
    add_header X-Content-Type-Options   "nosniff"                            always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin"    always;
    # HSTS — 2 years. includeSubDomains intentionally set; all rectorspace.com
    # subdomains should be HTTPS-only. Omitting "preload" for now — adding the
    # domain to the HSTS preload list is a permanent, irrevocable commitment.
    # To opt in later: append "; preload" and submit at https://hstspreload.org.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # -- Request limits ------------------------------------------------------
    # 10m covers large HTML doc uploads; Markdown is tiny.
    client_max_body_size 10m;

    # -- Proxy to app container ----------------------------------------------
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # $remote_addr is now the real client IP after real_ip_header above.
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_http_version 1.1;
        # Use the map above — passes "upgrade" for WS, empty string for HTTP.
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_read_timeout 60s;
    }
}
