name: edict

# Production compose for single-instance VPS deployment.
#
# Deployment notes:
# - nginx (see Task 53 config) reverse-proxies to 127.0.0.1:3000.
# - A .env file must exist alongside this compose file on the VPS (never committed).
#   See .env.example for required vars. POSTGRES_ADMIN_PASSWORD must be set in
#   the shell environment or in the .env file before starting.
# - DATABASE_URL in the app's .env must use the Docker network hostname:
#     postgres://edict_app:<pass>@db:5432/edict          (NOT 127.0.0.1)
#   db:5432 is how the app container reaches postgres over the compose network.
#   127.0.0.1:5432 is the host loopback — unreachable from inside a container.
# - DB port is intentionally NOT exposed to the host. Admin psql access:
#     docker compose -f docker-compose.prod.yml exec -T db psql -U edict_admin edict
#   This avoids competing on the host's 5432 with other VPS projects and
#   eliminates any external exposure risk even on the loopback interface.
# - docker image prune -f after every deploy (per VPS ops convention).
#   NEVER run docker system prune on a shared VPS.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # Bound to loopback only — nginx proxies inbound traffic here.
      # Never bind to 0.0.0.0 on a shared VPS.
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    logging:
      # Cap log size to prevent disk exhaustion on a long-running VPS instance.
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: edict_admin
      # ${VAR:?msg} syntax fails fast at `docker compose up` if the var is unset.
      # Set POSTGRES_ADMIN_PASSWORD in the host shell or in .env before deploying.
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD must be set before starting}
      POSTGRES_DB: edict
    volumes:
      # Named volume for postgres data — survives container recreation.
      - edict_pg_data:/var/lib/postgresql/data
      # Bind-mount for pg_dump output. Directory created by Task 55 runbook.
      # .gitignore excludes /backups/ to prevent accidental dump commits.
      - ./backups:/backups
    # No ports: block — DB is NOT exposed to the host.
    # Use: docker compose -f docker-compose.prod.yml exec -T db psql -U edict_admin edict
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edict_admin -d edict"]
      interval: 10s
      timeout: 3s
      retries: 10
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # Named volume persists postgres data across container/compose recreations.
  # To destroy all data: docker volume rm edict_edict_pg_data
  edict_pg_data:
